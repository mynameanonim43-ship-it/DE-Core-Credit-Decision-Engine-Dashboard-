<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vantage — Platform Analisis Kredit Cerdas. Alat bantu analis untuk penilaian kelayakan kredit, rekomendasi nominal, dan monitoring EWS pasca-pencairan.">
  <title>Vantage — Credit Intelligence Platform</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/main.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b82f6'/><text y='22' x='5' font-size='20'>📊</text></svg>">
</head>
<body>
<div id="app">

  <!-- ============================================================
       ENHANCED SPLASH SCREEN
       ============================================================ -->
  <div id="splash-screen" class="splash-screen enhanced-splash" onclick="dismissSplash()" title="Klik untuk langsung masuk">
    <div class="splash-content">
      <div class="splash-logo enhanced-logo">📊</div>
      <h1 class="splash-title glow-title">Vantage</h1>
      <p class="splash-subtitle typing-effect">Credit Intelligence Platform</p>
      <div class="splash-loader enhanced-loader"></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:24px;cursor:pointer;opacity:0.7;letter-spacing:1px;animation: pulseText 2s infinite">
        Klik layar untuk lewati
      </div>
    </div>
  </div>

  <style>
    /* Enhanced Splash Screen Styles */
    .enhanced-splash {
      background: rgba(15, 23, 42, 0.9) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }
    
    .enhanced-logo {
      font-size: 72px !important;
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
      animation: floatLogo 3s ease-in-out infinite !important;
    }
    
    .glow-title {
      background: linear-gradient(to right, #60a5fa, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: gradientShift 3s linear infinite;
      margin-bottom: 8px !important;
    }

    .typing-effect {
      overflow: hidden;
      white-space: nowrap;
      margin: 0 auto 32px auto !important;
      letter-spacing: 3px !important;
      border-right: 2px solid #8b5cf6;
      animation: typing 1.5s steps(30, end), blinkCursor 0.75s step-end infinite;
      width: fit-content;
    }
    
    .enhanced-loader {
      width: 240px !important;
      height: 6px !important;
      background: rgba(255, 255, 255, 0.05) !important;
      border-radius: 10px !important;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }
    
    .enhanced-loader::after {
      content: '';
      position: absolute;
      top: 0; left: 0; height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899) !important;
      background-size: 200% 100%;
      border-radius: 10px;
      animation: smoothLoad 2s cubic-bezier(0.4, 0, 0.2, 1) infinite, shimmer 2s linear infinite !important;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4)); }
      50% { transform: translateY(-15px) scale(1.05); filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.8)); }
    }
    @keyframes gradientShift {
      to { background-position: 200% center; }
    }
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blinkCursor {
      from, to { border-color: transparent }
      50% { border-color: #8b5cf6; }
    }
    @keyframes smoothLoad {
      0% { width: 0%; left: 0%; }
      50% { width: 100%; left: 0%; }
      100% { width: 100%; left: 100%; }
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📊</div>
      <div>
        <div class="logo-text">Vantage</div>
        <div class="logo-sub">Credit Intelligence</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Utama</div>

      <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">🏠</span>
        <span>Dashboard</span>
      </div>

      <div class="nav-item" data-page="borrowers" onclick="navigate('borrowers')">
        <span class="nav-icon">👥</span>
        <span>Daftar Borrower</span>
      </div>

      <div class="nav-item" data-page="analysis" onclick="navigate('analysis')">
        <span class="nav-icon">➕</span>
        <span>Analisis Baru</span>
      </div>

      <div class="nav-section-label">Monitor</div>

      <div class="nav-item" data-page="borrowers" onclick="navigate('borrowers',{filter:'ews'})">
        <span class="nav-icon">🚨</span>
        <span>EWS Aktif</span>
        <span class="nav-badge" id="ews-badge">0</span>
      </div>

      <div class="nav-section-label">Admin</div>

      <div class="nav-item" data-page="settings" onclick="navigate('settings')">
        <span class="nav-icon">⚙️</span>
        <span>Pengaturan</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name">Admin Utama</div>
          <div class="user-role">Super Admin</div>
        </div>
        <span style="color:var(--text-muted);font-size:12px">⚙</span>
      </div>
    </div>
  </aside>

  <!-- ============================================================
       MAIN CONTENT
       ============================================================ -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <!-- Mobile hamburger -->
      <button class="btn btn-ghost btn-icon" id="mobile-menu" style="display:none" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

      <span id="topbar-title" class="topbar-title">📊 Dashboard Portofolio</span>

      <div class="topbar-search">
        <span style="color:var(--text-muted)">🔍</span>
        <input type="text" id="global-search" placeholder="Cari borrower... (Enter)">
      </div>

      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="navigate('analysis')">
          ➕ Analisis Baru
        </button>

        <button class="btn btn-ghost btn-icon" title="Notifikasi" onclick="navigate('borrowers',{filter:'ews'})">
          🔔
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main>
      <div id="page-content" class="page active">
        <!-- Rendered by JS -->
        <div style="display:flex;align-items:center;justify-content:center;height:400px;flex-direction:column;gap:16px;color:var(--text-muted)">
          <div style="font-size:48px;animation:spin 1s linear infinite">⏳</div>
          <div style="font-size:14px">Memuat dashboard...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

</div>

<!-- ============================================================
     LOADING ANIMATION CSS (inline)
     ============================================================ -->
<style>
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>

<!-- ============================================================
     SCRIPTS (ES Modules)
     ============================================================ -->
<script>
  function dismissSplash() {
    var splash = document.getElementById('splash-screen');
    if (splash) {
      splash.classList.add('hidden');
      setTimeout(function() { if (splash && splash.parentNode) splash.remove(); }, 600);
    }
  }
  // Auto-dismiss after 2.5 seconds to show off the animations
  setTimeout(dismissSplash, 2500);
</script>

<script type="module" src="src/app.js"></script>
</body>
</html>
